name: Android-App bauen

# Baut aus dem Projekt eine installierbare APK-Datei.
#
# Buildozer läuft ausschließlich unter Linux - dieser Ablauf erledigt
# das deshalb auf einem Linux-Rechner bei GitHub, ganz ohne lokale
# Installation. Der erste Durchlauf dauert 30-45 Minuten (Android-SDK
# und -NDK werden geladen), spätere sind dank Zwischenspeicher
# deutlich kürzer.
#
# Starten: Reiter "Actions" -> "Android-App bauen" -> "Run workflow".
# Ergebnis: unten auf der Seite des Laufs unter "Artifacts".

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Reine Textänderungen brauchen keine neue APK - das spart bei
    # jeder Dokumentationsänderung zehn Minuten Rechenzeit.
    paths-ignore:
      - "**.md"

jobs:

  apk:

    runs-on: ubuntu-latest

    # Der erste Lauf lädt SDK und NDK - das darf dauern.
    timeout-minutes: 120

    steps:

      - name: Projekt holen
        uses: actions/checkout@v4

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Spart bei jedem weiteren Lauf das erneute Laden von SDK/NDK.
      # Ändert sich buildozer.spec, wird der Zwischenspeicher erneuert.
      - name: Zwischenspeicher
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          # Die Zahl hinter "buildozer-" ist ein Generationszähler:
          # Er trennt die Speicherstände sauber, seit die Werkzeugkette
          # in buildozer.spec festgenagelt ist. Ohne ihn käme über die
          # unscharfen restore-keys womöglich ein Stand von davor
          # zurück (python-for-android vom Zweig master samt NDK r28c).
          #
          # Bei einem Werkzeugwechsel: Zahl erhöhen statt raten.
          key: buildozer-2-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-2-

      # Der Bau übersetzt Python selbst mit - dafür braucht er die
      # Entwicklungspakete der Bibliotheken, gegen die Python linkt
      # (zlib, ssl, ffi, sqlite, bz2, lzma, readline, ...). Fehlt eines
      # davon, bricht er mitten im Übersetzen ab.
      - name: Werkzeuge einrichten
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git zip unzip openjdk-17-jdk \
            autoconf automake libtool libtool-bin libltdl-dev m4 \
            pkg-config cmake patch python3-dev \
            zlib1g-dev libffi-dev libssl-dev libsqlite3-dev \
            libbz2-dev liblzma-dev libreadline-dev libncurses-dev \
            libncursesw5-dev libgdbm-dev tk-dev uuid-dev
          pip install --upgrade buildozer cython==0.29.36

      # Die Ausgabe zusätzlich in eine Datei schreiben, damit sie im
      # Fehlerfall komplett heruntergeladen werden kann.
      #
      # pipefail ist zwingend: Ohne diese Zeile liefert die Pipe den
      # Rückgabewert von "tee" (immer 0), ein fehlgeschlagener Bau
      # würde also als Erfolg durchgehen.
      # ACLOCAL_PATH: Das Rezept "libffi" ruft autoreconf auf und fand
      # dabei die Makros von libtool nicht ("possibly undefined macro:
      # LT_SYS_SYMBOL_USCORE"). Mit gesetztem Suchpfad findet aclocal
      # sie zuverlässig.
      - name: APK bauen
        env:
          ACLOCAL_PATH: /usr/share/aclocal
        run: |
          set -o pipefail

          # Zwei Anläufe.
          #
          # Die Rezepte holen ihre Quellen von fremden Servern -
          # freetype etwa von savannah.gnu.org, das schon einmal mit
          # "502 Bad Gateway" ausgefallen ist und den ganzen Bau
          # mitgerissen hat. Der zweite Anlauf macht dort weiter, wo
          # es hakte: Bereits Gebautes überspringt python-for-android,
          # ein echter Fehler schlägt also weiterhin schnell durch.
          if buildozer android debug 2>&1 | tee bauprotokoll.txt; then
            exit 0
          fi

          echo "=== Erster Anlauf gescheitert - zweiter Versuch ===" \
            | tee -a bauprotokoll.txt

          buildozer android debug 2>&1 | tee -a bauprotokoll.txt

      # Fester Signaturschlüssel.
      #
      # Android lässt ein Update nur zu, wenn die neue Fassung
      # denselben Schlüssel trägt wie die installierte. Gradle erzeugt
      # sich sonst bei jedem Lauf einen neuen - die alte App müsste
      # weichen, und mit ihr die Datenbank.
      #
      # Unterschrieben wird deshalb hier, ausdrücklich und im
      # Nachhinein: Es genügte NICHT, den Schlüssel unter
      # ~/.android/debug.keystore abzulegen - Gradle sucht ihn dort
      # nicht (nachgemessen, Lauf 28: die APK trug einen fremden
      # Fingerabdruck). apksigner ersetzt die Unterschrift der
      # fertigen Datei und hängt von keiner Suchregel ab.
      - name: APK unterschreiben
        run: |
          APK=$(ls bin/*.apk | head -1)
          APKSIGNER=$(find ~/.buildozer -name apksigner -type f 2>/dev/null | head -1)

          echo "APK:        $APK"
          echo "apksigner:  $APKSIGNER"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner nicht gefunden - ohne ihn laesst sich"\
                 "die Unterschrift nicht festlegen."
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks android/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            "$APK"

      # Nachprüfen statt hoffen: Ist die fertige APK wirklich mit
      # unserem Schlüssel unterschrieben?
      #
      # Stimmt der Fingerabdruck nicht, bricht der Lauf hier ab - eine
      # APK mit fremdem Schlüssel wäre schlimmer als keine: Sie ließe
      # sich installieren, aber erst beim NÄCHSTEN Update fiele auf,
      # dass die Kette gerissen ist.
      - name: Signatur prüfen
        run: |
          ERWARTET="35:34:42:AF:E7:E8:15:32:21:C4:FF:1E:4D:69:7B:FF:DB:2E:AD:A4:9F:11:B9:6D:8E:7C:4C:0C:DD:1C:CA:06"

          APK=$(ls bin/*.apk | head -1)
          echo "APK:        $APK"

          # apksigner steckt in den Build-Tools des SDK. Wird es nicht
          # gefunden, tut es auch keytool - beide lesen dasselbe
          # Zertifikat aus der Datei.
          APKSIGNER=$(find ~/.buildozer -name apksigner -type f 2>/dev/null | head -1)

          if [ -n "$APKSIGNER" ]; then
            echo "Werkzeug:   $APKSIGNER"
            GEFUNDEN=$("$APKSIGNER" verify --print-certs "$APK" \
              | grep -i "SHA-256 digest" | head -1 \
              | sed 's/.*: *//' | tr -d ' ' | tr 'a-f' 'A-F')
          else
            echo "Werkzeug:   keytool (apksigner nicht gefunden)"
            GEFUNDEN=$(keytool -printcert -jarfile "$APK" \
              | grep -i "SHA256:" | head -1 \
              | sed 's/.*: *//' | tr -d ': ' | tr 'a-f' 'A-F')
          fi

          if [ -z "$GEFUNDEN" ]; then
            echo "::error::Aus der APK liess sich kein Fingerabdruck lesen"
            exit 1
          fi

          NORMIERT=$(echo "$ERWARTET" | tr -d ':')

          echo "erwartet:   $NORMIERT"
          echo "gefunden:   $GEFUNDEN"

          if [ "$GEFUNDEN" != "$NORMIERT" ]; then
            echo "::error::Fremder Schluessel: gefunden $GEFUNDEN,"\
                 "erwartet $NORMIERT - ein Update wuerde die Datenbank kosten."
            exit 1
          fi

          echo "::notice::Signatur stimmt ($GEFUNDEN) - Updates behalten die Datenbank."

      # Auch (und gerade) wenn der Bau scheitert: Protokoll sichern.
      - name: Bauprotokoll bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bauprotokoll
          path: |
            bauprotokoll.txt
            .buildozer/android/platform/build-*/build.log
          if-no-files-found: warn

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: KiG-POS-APK
          path: bin/*.apk
          if-no-files-found: error
